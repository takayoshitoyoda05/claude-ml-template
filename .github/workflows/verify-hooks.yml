name: Verify Hooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run hook verification
        run: |
          chmod +x verify-hooks.sh
          ./verify-hooks.sh

      - name: Run installer verification
        run: |
          chmod +x verify-installers.sh
          ./verify-installers.sh

      - name: Check verify-hooks.ps1 syntax
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "verify-hooks.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
